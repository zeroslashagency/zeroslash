name: Reassemble chunked upload

on:
  push:
    branches: [main]
    paths: ['.push-chunks/**']

permissions:
  contents: write

concurrency:
  group: reassemble-main
  cancel-in-progress: false

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Reassemble images from chunks
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          if [ ! -f .push-chunks/manifest.txt ]; then
            echo "No manifest, nothing to reassemble."
            exit 0
          fi
          need_push=0
          while IFS='|' read -r target sha size; do
            [ -n "$target" ] || continue
            target="$(printf '%s' "$target" | tr -d '\r')"
            sha="$(printf '%s' "$sha" | tr -d '[:space:]')"
            size="$(printf '%s' "$size" | tr -d '[:space:]')"
            if [ -f "$target" ] && [ "$(shasum -a 256 "$target" | cut -d' ' -f1)" = "$sha" ]; then
              echo "OK (exists): $target"
              continue
            fi
            chunkdir=".push-chunks/$(basename "$target")"
            mapfile -t parts < <(find "$chunkdir" -name '*.part*' 2>/dev/null | sort || true)
            if [ "${#parts[@]}" -eq 0 ]; then echo "MISSING CHUNKS for $target"; exit 1; fi
            mkdir -p "$(dirname "$target")"
            cat "${parts[@]}" > "$target"
            got="$(shasum -a 256 "$target" | cut -d' ' -f1)"
            gotsize="$(wc -c < "$target" | tr -d '[:space:]')"
            [ "$got" = "$sha" ] || { echo "SHA MISMATCH $target"; exit 1; }
            [ "$gotsize" -eq "$size" ] || { echo "SIZE MISMATCH $target ($gotsize != $size)"; exit 1; }
            echo "REASSEMBLED: $target"
            need_push=1
          done < .push-chunks/manifest.txt
          if [ "$need_push" = "0" ]; then echo "All images already present."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/flora
          git commit -m "Reassemble flora images from chunked upload" || exit 0
          git push origin HEAD:main
